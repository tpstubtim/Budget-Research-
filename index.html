.simple h3{margin:0 0 10px;font-size:1.05rem}

.simple h3{margin:0 0 6px;font-size:1.05rem}

/* detail page polish */
.rt{flex-wrap:nowrap;align-items:center}

/* simple detail list */

.expcard #list .sr span:first-child{min-width:0}
.expcard #list .tot{font-size:1.02rem}
@media (max-width:700px){.expcard .main>div:first-child{max-width:240px}}

/* expense card — PC layout: donut + legend on the left, groups in two columns on the right */
.expcard .main{display:grid!important;grid-template-columns:260px minmax(0,1fr)!important;gap:40px!important;align-items:start!important}
.expcard .main>div:first-child{max-width:none;margin:0;position:sticky;top:20px}
.expcard .donut{max-width:220px;margin:0 auto}
.expcard .mid b{font-size:.98rem}.expcard .mid span{font-size:.75rem}
.expcard .go{margin:12px auto 0}
.expcard .elg{margin-top:18px;border-top:1px solid var(--bd);padding-top:8px}
.expcard .el{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;font-size:.9rem;border-radius:8px;cursor:pointer}
.expcard .el:hover,.expcard .el.on{background:var(--bg)}
.expcard .el .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.expcard .el b{font-variant-numeric:tabular-nums}
.expcard #list{display:block}
.expcard #list .tot{grid-column:1/-1}
.expcard #list .g{padding:14px 0 12px;border-bottom:1px solid var(--bd)}
.expcard #list .g:first-child{padding-top:0}

@media (max-width:700px){
 .expcard .main{grid-template-columns:1fr!important;gap:18px!important}
 .expcard .main>div:first-child{position:static}
 .expcard .donut{max-width:220px}
}
.pieb{position:relative}
.pmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pmid small{color:var(--mu);font-size:.75rem}.pmid b{font-size:.95rem;font-variant-numeric:tabular-nums}
.tab.on{background:#a7e6d2;border-color:#a7e6d2;color:#2d3a35}
.hero h1,.hero p{color:#2d3a35}
.ibadge .em{font-size:20px;line-height:1}
.kpi .ibadge .em{font-size:20px}

.hrow{display:flex;align-items:center;gap:18px}
.logo{flex:none;width:100px;height:100px;background:transparent;display:grid;place-items:center}
.logo img{width:84px;height:84px;object-fit:contain;display:block}
@media (max-width:560px){.logo{width:74px;height:74px}.logo img{width:60px;height:60px}.hrow{gap:12px}}
</style>
